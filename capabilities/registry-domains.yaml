naftiko: 1.0.0-alpha2
info:
  label: SwaggerHub Registry API — Domains
  description: 'SwaggerHub Registry API — Domains. 3 operations. Lead operation: Get Domain Versions. Self-contained Naftiko
    capability covering one Swaggerhub business surface.'
  tags:
  - Swaggerhub
  - Domains
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SWAGGERHUB_API_KEY: SWAGGERHUB_API_KEY
capability:
  consumes:
  - type: http
    namespace: registry-domains
    baseUri: https://api.swaggerhub.com
    description: SwaggerHub Registry API — Domains business capability. Self-contained, no shared references.
    resources:
    - name: domains-owner-domain
      path: /domains/{owner}/{domain}
      operations:
      - name: getdomainversions
        method: GET
        description: Get Domain Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: domain
          in: path
          type: string
          required: true
      - name: createorupdatedomain
        method: POST
        description: Create or Update Domain
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: domain
          in: path
          type: string
          required: true
        - name: version
          in: query
          type: string
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deletedomain
        method: DELETE
        description: Delete Domain
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: domain
          in: path
          type: string
          required: true
    authentication:
      type: apikey
      key: Authorization
      value: '{{env.SWAGGERHUB_API_KEY}}'
      placement: header
  exposes:
  - type: rest
    namespace: registry-domains-rest
    port: 8080
    description: REST adapter for SwaggerHub Registry API — Domains. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/domains/{owner}/{domain}
      name: domains-owner-domain
      description: REST surface for domains-owner-domain.
      operations:
      - method: GET
        name: getdomainversions
        description: Get Domain Versions
        call: registry-domains.getdomainversions
        with:
          owner: rest.owner
          domain: rest.domain
        outputParameters:
        - type: object
          mapping: $.
      - method: POST
        name: createorupdatedomain
        description: Create or Update Domain
        call: registry-domains.createorupdatedomain
        with:
          owner: rest.owner
          domain: rest.domain
          version: rest.version
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
      - method: DELETE
        name: deletedomain
        description: Delete Domain
        call: registry-domains.deletedomain
        with:
          owner: rest.owner
          domain: rest.domain
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: registry-domains-mcp
    port: 9090
    transport: http
    description: MCP adapter for SwaggerHub Registry API — Domains. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: get-domain-versions
      description: Get Domain Versions
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: registry-domains.getdomainversions
      with:
        owner: tools.owner
        domain: tools.domain
      outputParameters:
      - type: object
        mapping: $.
    - name: create-update-domain
      description: Create or Update Domain
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: registry-domains.createorupdatedomain
      with:
        owner: tools.owner
        domain: tools.domain
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-domain
      description: Delete Domain
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: registry-domains.deletedomain
      with:
        owner: tools.owner
        domain: tools.domain
      outputParameters:
      - type: object
        mapping: $.
