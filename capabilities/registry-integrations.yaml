      with:
        owner: tools.owner
        api: tools.api
        version: tools.version
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: delete-integration
      description: Delete Integration
      hints:
        readOnly: false
        destructive: true
        idempotent: true
      call: registry-integrations.deleteintegration
      with:
        owner: tools.owner
        api: tools.api
        version: tools.version
        integrationId: tools.integrationId
      outputParameters:
      - type: object
