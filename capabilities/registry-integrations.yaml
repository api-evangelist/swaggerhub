    baseUri: https://api.swaggerhub.com
    description: SwaggerHub Registry API — Integrations business capability. Self-contained, no shared references.
    resources:
    - name: apis-owner-api-version-integrations
      path: /apis/{owner}/{api}/{version}/integrations
      operations:
      - name: listintegrations
        method: GET
        description: List Integrations
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
      - name: createintegration
        method: POST
        description: Create Integration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apis-owner-api-version-integrations-integrationId
      path: /apis/{owner}/{api}/{version}/integrations/{integrationId}
      operations:
      - name: deleteintegration
        method: DELETE
        description: Delete Integration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        - name: integrationId
          in: path
          type: string
          required: true
    - name: apis-owner-api-version-integrations-integrationId-execute
      path: /apis/{owner}/{api}/{version}/integrations/{integrationId}/execute
      operations:
      - name: executeintegration
        method: POST
        description: Execute Integration
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        - name: integrationId
          in: path
          type: string
          required: true
    authentication:
