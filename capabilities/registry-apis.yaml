      operations:
      - name: getapidefinition
        method: GET
        description: Get API Definition
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
      - name: deleteapiversion
        method: DELETE
        description: Delete API Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
    - name: apis-owner-api-version-clone
      path: /apis/{owner}/{api}/{version}/clone
      operations:
      - name: cloneapiversion
        method: POST
        description: Clone API Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        - name: newVersion
          in: query
          type: string
    - name: apis-owner-api-version-comments
      path: /apis/{owner}/{api}/{version}/comments
      operations:
      - name: getapicomments
        method: GET
        description: Get API Comments
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
      - name: addapicomment
        method: POST
        description: Add API Comment
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: apis-owner-api-version-fork
      path: /apis/{owner}/{api}/{version}/fork
      operations:
      - name: forkapiversion
        method: POST
        description: Fork API Version
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
        - name: newOwner
          in: query
          type: string
        - name: newApi
          in: query
