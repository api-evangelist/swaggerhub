        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
          type: string
          required: true
    - name: apis-owner-api-version-swagger.yaml
      path: /apis/{owner}/{api}/{version}/swagger.yaml
      operations:
      - name: getapidefinitionyaml
        method: GET
        description: Get API Definition YAML
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: path
