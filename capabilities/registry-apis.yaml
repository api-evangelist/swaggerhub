naftiko: 1.0.0-alpha2
info:
  label: SwaggerHub Registry API — APIs
  description: 'SwaggerHub Registry API — APIs. 13 operations. Lead operation: Get Owner APIs. Self-contained Naftiko capability
    covering one Swaggerhub business surface.'
  tags:
  - Swaggerhub
  - APIs
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    SWAGGERHUB_API_KEY: SWAGGERHUB_API_KEY
capability:
  consumes:
  - type: http
    namespace: registry-apis
    baseUri: https://api.swaggerhub.com
    description: SwaggerHub Registry API — APIs business capability. Self-contained, no shared references.
    resources:
    - name: apis-owner
      path: /apis/{owner}
      operations:
      - name: getownerapis
        method: GET
        description: Get Owner APIs
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          description: Owner username or organization name
          required: true
        - name: page
          in: query
          type: integer
        - name: limit
          in: query
          type: integer
    - name: apis-owner-api
      path: /apis/{owner}/{api}
      operations:
      - name: getapiversions
        method: GET
        description: Get API Versions
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
      - name: createorupdateapi
        method: POST
        description: Create or Update API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: version
          in: query
          type: string
          description: Version string (defaults to 0.0.1)
        - name: isPrivate
          in: query
          type: boolean
        - name: force
          in: query
          type: boolean
          description: Force update even if version is published
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
      - name: deleteapi
        method: DELETE
        description: Delete API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
    - name: apis-owner-api-rename
      path: /apis/{owner}/{api}/rename
      operations:
      - name: renameapi
        method: POST
        description: Rename API
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: owner
          in: path
          type: string
          required: true
        - name: api
          in: path
          type: string
          required: true
        - name: newName
          in: query
          type: string
          required: true
    - name: apis-owner-api-version
