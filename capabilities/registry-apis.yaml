      name: apis-owner
      description: REST surface for apis-owner.
      operations:
      - method: GET
        name: getownerapis
        description: Get Owner APIs
        call: registry-apis.getownerapis
        with:
          owner: rest.owner
          page: rest.page
          limit: rest.limit
        outputParameters:
        - type: object
