  - type: mcp
    namespace: registry-apis-mcp
    port: 9090
    transport: http
    description: MCP adapter for SwaggerHub Registry API — APIs. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: get-owner-apis
      description: Get Owner APIs
      hints:
