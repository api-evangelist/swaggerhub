naftiko: "1.0.0-alpha1"

info:
  label: "SwaggerHub User Management API"
  description: >-
    Automate SwaggerHub user provisioning, organization membership management,
    and team access control. Supports adding/removing members, changing roles,
    and managing team composition.
  tags:
    - Access Control
    - Organizations
    - SmartBear
    - SwaggerHub
    - Teams
    - User Management
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      SWAGGERHUB_API_KEY: SWAGGERHUB_API_KEY

capability:
  consumes:
    - type: http
      namespace: swaggerhub-user-mgmt
      baseUri: https://api.swaggerhub.com
      description: "SwaggerHub User Management API"
      authentication:
        type: apikey
        key: Authorization
        value: "{{SWAGGERHUB_API_KEY}}"
        placement: header
      resources:
        - name: org-members
          path: /orgs/{org}/members
          description: "Organization member management"
          operations:
            - name: get-organization-members
              method: GET
              description: "List all members of an organization"
              inputParameters:
                - name: org
                  in: path
                  type: string
                  required: true
                - name: page
                  in: query
                  type: integer
                  required: false
                - name: limit
                  in: query
                  type: integer
                  required: false
                - name: q
                  in: query
                  type: string
                  required: false
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: add-organization-members
              method: POST
              description: "Invite users to an organization"
              inputParameters:
                - name: org
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  members: "{{tools.members}}"

        - name: org-teams
          path: /orgs/{org}/teams
          description: "Team management"
          operations:
            - name: get-organization-teams
              method: GET
              description: "List all teams in an organization"
              inputParameters:
                - name: org
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

            - name: create-team
              method: POST
              description: "Create a new team"
              inputParameters:
                - name: org
                  in: path
                  type: string
                  required: true
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"

  exposes:
    - type: rest
      port: 8101
      namespace: swaggerhub-user-mgmt-rest
      resources:
        - path: /v1/orgs/{org}/members
          name: org-members
          operations:
            - method: GET
              name: get-organization-members
              description: "List organization members"
              call: "swaggerhub-user-mgmt.get-organization-members"
              with:
                org: "rest.org"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/orgs/{org}/teams
          name: org-teams
          operations:
            - method: GET
              name: get-organization-teams
              description: "List organization teams"
              call: "swaggerhub-user-mgmt.get-organization-teams"
              with:
                org: "rest.org"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9101
      namespace: swaggerhub-user-mgmt-mcp
      transport: http
      tools:
        - name: get-organization-members
          description: "List all members of a SwaggerHub organization"
          hints:
            readOnly: true
            idempotent: true
          call: "swaggerhub-user-mgmt.get-organization-members"
          with:
            org: "tools.org"
          outputParameters:
            - type: object
              mapping: "$."

        - name: add-organization-members
          description: "Invite users to a SwaggerHub organization with a specified role"
          hints:
            readOnly: false
            idempotent: false
          call: "swaggerhub-user-mgmt.add-organization-members"
          with:
            org: "tools.org"
            members: "tools.members"
          outputParameters:
            - type: object
              mapping: "$."

        - name: get-organization-teams
          description: "List all teams in a SwaggerHub organization"
          hints:
            readOnly: true
            idempotent: true
          call: "swaggerhub-user-mgmt.get-organization-teams"
          with:
            org: "tools.org"
          outputParameters:
            - type: object
              mapping: "$."
