aid: swaggerhub
name: SwaggerHub
description: >-
  SwaggerHub is SmartBear's enterprise collaborative API design and documentation platform built around the OpenAPI
  specification. It provides tools for designing, building, documenting, and consuming RESTful APIs with support for
  OpenAPI 2.0, OpenAPI 3.0, OpenAPI 3.1, and AsyncAPI specifications. The platform offers automated validation, team
  collaboration, lifecycle management, integrations with CI/CD pipelines, and an organizational API registry.
type: Index
